version: '2.4'

services:
  project-board:
    image: postgres:latest
    container_name: project-board
    ports:
      - "5432:5432"
    environment:
      POSTGRES_ROOT_PASSWORD: "root"
      POSTGRES_USER: "uno"
      POSTGRES_PASSWORD: "uno"
      POSTGRES_DB: "board"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - board-network

  app:
    image: eclipse-temurin:17-jdk-jammy
    container_name: project-board-app
    ports:
      - "8080:8080"
    environment:
      LOCAL_DB_URL: "jdbc:postgresql://localhost:5432/board"
      LOCAL_DB_USERNAME: "uno"
      LOCAL_DB_PASSWORD: "uno"
    depends_on:
      - project-board
    volumes:
      - ./build/libs:/app
    working_dir: /app
    command: java -jar project-board-0.0.1-SNAPSHOT.jar
    networks:
      - board-network

volumes:
  db_data:

networks:
  board-network:
    driver: bridge
